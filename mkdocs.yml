site_name: Metadata Extraction Service
site_description: Documentation of the EOSC EDEN Metadata Extraction Service (MES).
repo_url: https://github.com/EOSC-EDEN/metadata-extraction-service
docs_dir: docs
exclude_docs: |
  casts/

plugins:
  - search

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Tutorials:
      - First extraction with curl: tutorials/first-extraction-curl.md
      - First extraction in the web UI: tutorials/first-extraction-web-ui.md
  - How-to guides:
      - Run with Docker Compose: how-to/docker-compose.md
      - Enable optional tools: how-to/optional-tools.md
      - Add a tool: adding-a-tool.md
      - Configure local format rules: how-to/local-format-rules.md
      - Use asynchronous jobs and Redis: how-to/async-jobs.md
      - Extract several files at once: how-to/batch-extraction.md
      - Integrate FFIS: how-to/ffis.md
      - Monitor the service: how-to/monitoring.md
      - Set limits and purge jobs: how-to/limits-and-purging.md
  - Reference:
      - REST API: reference/rest-api.md
      - Environment variables and build args: reference/configuration.md
      - Result container and statuses: reference/result-container.md
      - Tools: reference/tools.md
  - Explanation:
      - Use cases and actors: use-cases.md
      - Architecture diagrams: diagrams.md
      - The persistence boundary: explanation/persistence-boundary.md
      - Why raw tool output is unmodified: explanation/raw-output.md
  - Specification: specification.md
