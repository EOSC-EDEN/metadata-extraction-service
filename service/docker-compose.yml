x-mes-environment: &mes-environment
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY}
  DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
  MES_DEFAULT_TOOL: ${MES_DEFAULT_TOOL:-exiftool}
  MES_FFIS_ENABLED: ${MES_FFIS_ENABLED:-false}
  # Point at a running FFIS instance (e.g. http://host.docker.internal:8001).
  MES_FFIS_BASE_URL: ${MES_FFIS_BASE_URL:-}
  MES_FFIS_TIMEOUT_SECONDS: ${MES_FFIS_TIMEOUT_SECONDS:-30}
  MES_TOOL_RULES_FILE: ${MES_TOOL_RULES_FILE:-config/tool_rules.yaml}
  MES_MAX_UPLOAD_BYTES: ${MES_MAX_UPLOAD_BYTES:-536870912}
  MES_MAX_FILES_PER_REQUEST: ${MES_MAX_FILES_PER_REQUEST:-10}
  MES_MAX_CONCURRENT_TOOLS: ${MES_MAX_CONCURRENT_TOOLS:-4}
  MES_ASYNC_ENABLED: ${MES_ASYNC_ENABLED:-true}
  MES_ASYNC_MAX_WORKERS: ${MES_ASYNC_MAX_WORKERS:-2}
  MES_ASYNC_MAX_JOBS: ${MES_ASYNC_MAX_JOBS:-100}
  MES_JOB_TTL_SECONDS: ${MES_JOB_TTL_SECONDS:-86400}
  # Job state: "memory" (one worker process only) or "redis" (shared by all workers; start with
  # `docker compose --profile redis up`).
  MES_JOB_STORE: ${MES_JOB_STORE:-memory}
  MES_REDIS_URL: ${MES_REDIS_URL:-redis://redis:6379/0}

services:
  mes:
    container_name: eosc-mes
    image: eosc-mes:local
    build:
      context: .
      args:
        INSTALL_EXIFTOOL: ${INSTALL_EXIFTOOL:-true}
        INSTALL_MEDIAINFO: ${INSTALL_MEDIAINFO:-true}
        INSTALL_FFPROBE: ${INSTALL_FFPROBE:-false}
        INSTALL_IMAGEMAGICK: ${INSTALL_IMAGEMAGICK:-false}
        INSTALL_METAFLAC: ${INSTALL_METAFLAC:-false}
        INSTALL_FILE_SCRAPER: ${INSTALL_FILE_SCRAPER:-false}
    ports:
      - "8000:8000"
    environment:
      <<: *mes-environment
      # With MES_JOB_STORE=memory keep ONE worker process (more breaks job lookups); with redis
      # it can be raised.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      # Opt-in tools (set to true once the tool is installed / reachable).
      MES_FFPROBE_ENABLED: ${MES_FFPROBE_ENABLED:-false}
      MES_IMAGEMAGICK_ENABLED: ${MES_IMAGEMAGICK_ENABLED:-false}
      MES_METAFLAC_ENABLED: ${MES_METAFLAC_ENABLED:-false}
      MES_FILE_SCRAPER_ENABLED: ${MES_FILE_SCRAPER_ENABLED:-false}
      MES_FILE_SCRAPER_SKIP_WELLFORMED: ${MES_FILE_SCRAPER_SKIP_WELLFORMED:-false}
      MES_TIKA_ENABLED: ${MES_TIKA_ENABLED:-false}
      MES_TIKA_URL: ${MES_TIKA_URL:-http://tika:9998}
    volumes:
      # Uploads while they are processed. Replace with a bind mount if you prefer.
      - mes-uploads:/var/lib/mes/uploads
      # Local format rules (edit config/tool_rules.yaml; no rebuild needed).
      - ./config:/app/config:ro
    restart: unless-stopped

  # Redis job store: `docker compose --profile redis up` with MES_JOB_STORE=redis.
  redis:
    profiles: ["redis"]
    container_name: eosc-mes-redis
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Deletes expired jobs and orphaned uploads every TTL/4 (1 min to 1 h), derived from
  # MES_JOB_TTL_SECONDS: change it in .env and restart this service.
  mes-purge:
    profiles: ["redis"]
    container_name: eosc-mes-purge
    image: eosc-mes:local
    command: ["sh", "scripts/purge-loop.sh"]
    environment: *mes-environment
    volumes:
      - mes-uploads:/var/lib/mes/uploads
      - ./config:/app/config:ro
    healthcheck:
      disable: true
    depends_on:
      - redis
    restart: unless-stopped

  # Optional Apache Tika server: `docker compose --profile tika up`, with MES_TIKA_ENABLED=true.
  tika:
    profiles: ["tika"]
    image: apache/tika:4.1.0-full
    restart: unless-stopped

volumes:
  mes-uploads:
  redis-data:
