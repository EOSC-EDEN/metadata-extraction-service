# Local format rules: link file formats to extraction tools without the external Format Library.
# Read from MES_TOOL_RULES_FILE (default: config/tool_rules.yaml); a missing file means no rules.
# Validated at startup; restart is not needed to change rules, the file is re-read when it changes.
#
# A rule matches on its PUID OR its extension (match: any, the default), or on both (match: all).
# When at least one rule matches, only the tools of ALL matching rules (de-duplicated) run. The default
# tool (MES_DEFAULT_TOOL) is the fallback: it is the only tool that runs when no rule matches.
# A rule naming a disabled tool, or one that is not in MES_TOOLS, skips it with a warning (startup logs the unknown ones).
#
# rules:
#   - name: flac-audio          # unique
#     puids: [fmt/279]          # PRONOM identifiers (case-insensitive)
#     extensions: [flac]        # case-insensitive, leading dot optional
#     tools: [metaflac]
#     # match: any              # or "all" (needs both puids and extensions)
rules:
  - name: flac-audio
    puids: [fmt/279] 
    extensions: [flac]
    tools: [metaflac]
